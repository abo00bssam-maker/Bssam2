<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مختبر المنطق - الأستاذ أبو بسام</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        
        :root {
            --bg-deep: #020617;
            --panel-navy: #0f172a;
            --accent-gold: #fbbf24;
            --accent-sky: #0ea5e9;
            --success-green: #10b981;
            --error-red: #ef4444;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep); 
            color: #f8fafc;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
            padding: 20px;
            touch-action: none; 
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.3);
            flex-shrink: 0;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 25px;
            flex: 1;
            min-height: 0;
        }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow: hidden;
        }

        .question-box {
            background: rgba(30, 41, 59, 0.4);
            border: 2px solid #334155;
            border-right: 8px solid var(--accent-sky);
            padding: 20px;
            border-radius: 15px;
            flex-shrink: 0;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: rgba(15, 23, 42, 0.5);
            padding: 15px;
            border-radius: 12px;
            border: 1px dashed #475569;
        }

        .static-option {
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--accent-gold);
            text-align: center;
        }

        .analysis-flow {
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            padding-bottom: 20px;
            touch-action: pan-y;
        }

        .option-card {
            background: rgba(30, 41, 59, 0.4); /* خلفية أكثر وضوحاً */
            border: 1px solid #334155;
            border-right: 8px solid #334155;
            padding: 22px;
            border-radius: 18px;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0; /* مخفية في البداية فقط */
            flex-shrink: 0;
            transform: translateY(20px);
        }

        /* الحالة عند التحليل النشط */
        .option-card.active {
            opacity: 1;
            transform: translateY(0) scale(1.02);
            background: rgba(15, 23, 42, 0.95);
            border-right-color: var(--accent-gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* الحالة بعد انتهاء التحليل (تظل مضيئة) */
        .option-card.completed {
            opacity: 1;
            transform: translateY(0) scale(1);
            background: rgba(30, 41, 59, 0.6);
            border-right-color: var(--accent-gold);
        }

        .option-card.correct {
            border-right-color: var(--success-green) !important;
            background: rgba(16, 185, 129, 0.15) !important;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow: hidden;
        }

        .visual-lab {
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            border: 2px solid #334155;
            border-radius: 25px;
            flex: 1.8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        .display-formula {
            display: flex;
            align-items: center;
            gap: 25px;
            direction: ltr;
        }

        .unit-large { font-size: 5.5rem; font-weight: 900; }
        .op-large { font-size: 4rem; color: var(--accent-sky); }
        .res-box {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-left: 15px;
            padding-left: 25px;
            border-left: 4px solid rgba(51, 65, 85, 0.6);
        }

        .desc-box {
            width: 90%;
            background: rgba(2, 6, 23, 0.8);
            padding: 15px;
            border-radius: 15px;
            font-size: 1.4rem;
            text-align: center;
            margin-top: 25px;
            border-bottom: 4px solid var(--accent-sky);
        }

        .logic-table-container {
            background: var(--panel-navy);
            border: 2px solid #334155;
            border-radius: 20px;
            padding: 15px;
            flex: 1;
            overflow: hidden;
        }

        .l-table {
            width: 100%;
            height: 100%;
            border-collapse: separate;
            border-spacing: 5px;
            direction: ltr;
        }

        .l-table th { background: #1e293b; color: var(--accent-sky); font-size: 1rem; padding: 8px; border-radius: 8px; }
        .l-table td { background: rgba(255,255,255,0.03); text-align: center; border-radius: 8px; font-weight: 800; font-size: 1.5rem; }

        .row-active { background: rgba(16, 185, 129, 0.4) !important; outline: 3px solid var(--success-green); }

        .btn-start {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #000;
            padding: 12px 50px;
            border-radius: 15px;
            font-weight: 900;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(217,119,6,0.4);
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <header class="header-top">
        <div class="text-2xl font-black text-amber-400">🔬 مختبر البرهان المنطقي</div>
        <div class="text-xl font-bold text-slate-400">إشراف: الأستاذ أبو بسام</div>
    </header>

    <div class="main-layout">
        <div class="right-column">
            <div class="question-box">
                <div class="text-slate-400 text-lg mb-2">بفرض أن (T) صائبة و (F) خاطئة و (p) تقرير :</div>
                <div class="text-2xl font-black text-white mb-4">أي العبارات التالية تمثل تكافؤاً صائباً؟</div>
                
                <div class="options-grid">
                    <div class="static-option">أ) T → p ≡ F</div>
                    <div class="static-option">ب) F → p ≡ F</div>
                    <div class="static-option">ج) T → p ≡ T</div>
                    <div class="static-option">د) F → p ≡ T</div>
                </div>
            </div>

            <div class="analysis-flow" id="analysisFlow">
                <!-- سيتم توليد البطاقات هنا -->
            </div>
        </div>

        <div class="left-column">
            <div class="visual-lab">
                <div class="display-formula">
                    <div id="v-left" class="unit-large text-sky-400">?</div>
                    <div class="op-large">→</div>
                    <div id="v-right" class="unit-large text-slate-400">p</div>
                    <div class="res-box">
                        <div class="op-large">≡</div>
                        <div id="v-res" class="unit-large text-white">?</div>
                    </div>
                </div>
                <div class="desc-box" id="v-desc">بانتظار بدء التحليل المنطقي...</div>
            </div>

            <div class="logic-table-container">
                <table class="l-table">
                    <thead>
                        <tr><th>p</th><th>q</th><th>→</th><th>النتيجة</th></tr>
                    </thead>
                    <tbody>
                        <tr id="r1"><td>T</td><td>T</td><td>→</td><td class="text-green-400">T</td></tr>
                        <tr id="r2"><td>T</td><td>F</td><td>→</td><td class="text-red-400">F</td></tr>
                        <tr id="r3"><td>F</td><td>T</td><td>→</td><td class="text-green-400">T</td></tr>
                        <tr id="r4"><td>F</td><td>F</td><td>→</td><td class="text-green-400">T</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="flex justify-center mt-2">
                <button class="btn-start" onclick="runLab()">بدء تفنيد الخيارات 🚀</button>
            </div>
        </div>
    </div>

    <script>
        const labData = [
            { 
                label: "تفنيد الخيار (أ):",
                q: "T → p ≡ F", 
                a: "هذا الادعاء خاطئ؛ لأن النتيجة تعتمد على قيمة p. فإذا كانت p صائبة (T) سيكون الناتج صواباً وليس خطأً.",
                L: "T", R: "p", Res: "F", isOk: false 
            },
            { 
                label: "تفنيد الخيار (ب):",
                q: "F → p ≡ F", 
                a: "قانون الاستلزام يقرر أن البداية بفرض خاطئ (F) تؤدي دائماً لنتيجة صائبة (T). لذا التكافؤ مع F غير صحيح.",
                L: "F", R: "p", Res: "F", isOk: false
            },
            { 
                label: "تفنيد الخيار (ج):",
                q: "T → p ≡ T", 
                a: "هذه العبارة لا تمثل تحصيل حاصل؛ لأنه لو كانت p خاطئة (F)، سيصبح الناتج خاطئاً، وبذلك لا تكافئ T دائماً.",
                L: "T", R: "p", Res: "T", isOk: false
            },
            { 
                label: "تفنيد الخيار (د):",
                q: "F → p ≡ T", 
                a: "بما أن الفرض (F) خاطئ، فالقانون يضمن صواب العبارة دائماً بغض النظر عن p. هذا هو التكافؤ الصائب (تحصيل حاصل).",
                L: "F", R: "p", Res: "T", isOk: true
            }
        ];

        async function runLab() {
            const flow = document.getElementById('analysisFlow');
            const vL = document.getElementById('v-left');
            const vR = document.getElementById('v-right');
            const vRes = document.getElementById('v-res');
            const vDesc = document.getElementById('v-desc');
            const rows = document.querySelectorAll('tbody tr');

            flow.innerHTML = '';
            rows.forEach(r => r.className = '');

            for (let i = 0; i < labData.length; i++) {
                const item = labData[i];
                const card = document.createElement('div');
                card.className = "option-card active";
                
                const titleColor = item.isOk ? 'text-green-400' : 'text-amber-400';
                
                card.innerHTML = `
                    <div class="text-lg font-bold text-slate-400 mb-1">${item.label}</div>
                    <div class="text-2xl font-black ${titleColor} mb-2">${item.q}</div>
                    <div class="text-xl leading-relaxed text-slate-200">${item.a}</div>
                `;
                flow.appendChild(card);
                
                // تمرير تلقائي
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

                // تحديث المختبر
                vL.innerText = item.L;
                vR.innerText = item.R;
                vRes.innerText = item.Res;
                vRes.style.color = item.isOk ? "#10b981" : "#ef4444";
                vDesc.innerText = item.isOk ? "✅ تكافؤ صائب (تحصيل حاصل)" : "❌ تكافؤ خاطئ منطقياً";

                // انتظار 15 ثانية
                await new Promise(r => setTimeout(r, 15000));

                // عند الانتهاء من البطاقة:
                card.classList.remove('active');
                card.classList.add('completed'); // تظل مضيئة وواضحة
                
                if (item.isOk) {
                    card.classList.add('correct');
                    document.getElementById('r3').className = 'row-active';
                    document.getElementById('r4').className = 'row-active';
                }
            }
        }

        document.addEventListener('touchmove', function (e) {
            if (!e.target.closest('.analysis-flow')) {
                e.preventDefault();
            }
        }, { passive: false });

        window.onload = () => setTimeout(runLab, 1000);
    </script>
</body>
</html>
